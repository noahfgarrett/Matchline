name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # release.yml calls this workflow, so a tag build physically cannot skip the
  # hosted matrix. Tag pushes do not match the `branches` filter above, so
  # tagging runs the matrix exactly once — as part of the release, not beside it.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      # `postsetup` is not an npm lifecycle hook of `ci` — there is no `setup`
      # script for it to hang off — so nothing runs it implicitly and it has to
      # be invoked by name. It rebuilds esbuild and puts the Electron binary in
      # place for the runner's own platform, which is exactly the step that
      # differs between a Mac dev box and a Windows runner. Every OS in the
      # matrix runs it so all three test against the same installed tree.
      - name: Post-install setup
        run: npm run postsetup

      - name: Build
        run: npm run build

      - name: Test typed packages
        run: npm run test:workspaces

      - name: Integration tests
        run: npm run test:integration

      # The seven Windows-proof scripts (scripts/windows-proof/*.mjs), exercised
      # against the fake extractor (apps/desktop/test/fake-extractor.mjs) rather
      # than a real launcher — see tests/windows-proof/scripts.test.mjs. This is
      # what proves the scripts themselves fail when they should, on every OS in
      # the matrix; it is not the Autodesk proof, which stays self-hosted-only
      # (navisworks-proof.yml).
      - name: Windows-proof script tests
        run: npm run test:windows-proof

      # The 1.0 acceptance gates that have been wired to real behaviour. The
      # rest of tests/acceptance-1.0 is staged red on purpose (it describes
      # milestones that have not landed), so this runs the green subset by name
      # and each milestone adds its file to `test:acceptance10:green` as it
      # turns. A gate that goes green and then breaks fails CI here.
      - name: Acceptance gates (green subset)
        run: npm run test:acceptance10:green

      # The donor suite is plain JavaScript with its own scripts and is not part
      # of the TypeScript build. It runs by path so it is never run twice.
      # The differential tests compare against the frozen SSM Builder checkout at
      # an absolute path that exists only on Noah's Mac (see legacy-differential.mjs);
      # they run locally with every `npm test` and are excluded here rather than
      # editing the frozen donor tree (13 tests: data-output, edge-contract, corpus).
      # Wall-clock performance budgets are also excluded: shared runners are not a
      # perf environment (observed 12.3s vs an 8s budget); they run on real hardware.
      # `shell: bash` is not decoration: the runner default on windows-latest is
      # pwsh, which would glob `tests/*.test.mjs` and quote the skip pattern by
      # different rules. Naming bash pins all three runners to one command.
      - name: Test legacy parity suite
        shell: bash
        working-directory: packages/legacy-parity
        run: node --test --test-skip-pattern "frozen SSM Builder|preserves a frozen edge contract|budget" tests/*.test.mjs

  # The C# half that needs no Autodesk install: the protocol/DTO assembly, the
  # launcher, the real smoke harness, and a type-check of every version adapter
  # against native/navisworks-stubs. Runs on Linux and Windows — the launcher is
  # net48 and compiles on both (native/README.md, "Building"), and proving that
  # on Linux is what keeps the Mac-side build honest.
  native-smoke:
    name: native smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # native/Directory.Build.props falls back to 1.0.0-rc.1 without this, which
      # is only ever right by coincidence. Read once and pass to every `dotnet
      # build` below so meta.extractor_version (ExtractionRunner.cs) always
      # names the app version that shipped it, on every OS in the matrix.
      - name: Read the app version
        id: version
        shell: bash
        run: |
          set -eo pipefail
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "could not read \"version\" from package.json" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Matchline.Extraction.Common (netstandard2.0)
        run: dotnet build native/navisworks-common/Matchline.Extraction.Common.csproj -c Release -p:Version=${{ steps.version.outputs.value }}

      # net48 on a Linux runner: csc reads the pinned
      # Microsoft.NETFramework.ReferenceAssemblies metadata, never an installed
      # framework. Only the build is portable; the exe it produces is Windows-only.
      - name: Build Matchline.Extractor (net48 launcher)
        run: dotnet build native/extractor/Matchline.Extractor.csproj -c Release -p:Version=${{ steps.version.outputs.value }}

      # Synthetic records -> NdjsonWriter -> file -> NdjsonReader -> CacheWriter
      # -> SQLite -> CacheInspector, for real. No argument, so the harness picks
      # its own temp directory (native/smoke/Program.cs) and no path has to
      # survive a shell translation on Windows. Exit 0 means every check passed.
      - name: Run the Autodesk-free extraction smoke harness
        run: dotnet run --project native/smoke/Matchline.Extraction.Smoke.csproj -c Release

      # The 2024 and 2026 adapters arrive in M7 as new native/navisworks-<year>/
      # projects. Discovering them by glob means this job compiles them the day
      # they land, with nobody having to remember to edit CI. The four-digit
      # shape is what keeps navisworks-common/ and navisworks-stubs/ out of the
      # list. Finding none is a failure, not a pass: it means the layout moved.
      - name: Stub-compile every Navisworks adapter present
        shell: bash
        run: |
          set -eo pipefail
          shopt -s nullglob
          projects=(native/navisworks-[0-9][0-9][0-9][0-9]/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No native/navisworks-<year>/*.csproj found. The adapters moved or the glob is wrong; either way that is a failure, not a pass." >&2
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "--- stub compile: $project"
            dotnet build "$project" -c Release -p:UseNavisworksStubs=true -p:Version=${{ steps.version.outputs.value }}
          done
          echo "stub-compiled ${#projects[@]} adapter project(s)"

      # Windows-only from here: the launcher is Windows-only output, and this is
      # the one hosted job that actually runs it. Proves two things package-smoke
      # cannot: that the real Windows exe answers a bad command line the way
      # ExitCodes.cs promises (consumed below by package-smoke), and that
      # SQLitePCLRaw's win-x64 e_sqlite3.dll actually loads under net48 — the
      # open question native/extractor/Matchline.Extractor.csproj's own comment
      # leaves for a real Windows run.
      - name: Prepare a scratch input and a pre-seeded garbage cache
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'nw-not-installed'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $cacheDir = Join-Path $scratch 'cache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          $inputPath = Join-Path $scratch 'input.nwd'
          [System.IO.File]::WriteAllText($inputPath, 'not a real model')

          # Pre-seeded at the name the launcher will compute for $inputPath's own
          # hash, so CacheInspector rejects it (SqliteException: not a database)
          # and the run falls through to Navisworks discovery — proving the
          # STALE_CACHE_DISCARDED path and e_sqlite3.dll's load in one run,
          # instead of only the second half.
          $hash = (Get-FileHash -Path $inputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $garbageCache = Join-Path $cacheDir "$hash.sqlite"
          [System.IO.File]::WriteAllText($garbageCache, 'not a real sqlite file')

          echo "scratch=$scratch" >> $env:GITHUB_ENV
          echo "cacheDir=$cacheDir" >> $env:GITHUB_ENV
          echo "inputPath=$inputPath" >> $env:GITHUB_ENV

      - name: Run the launcher against no Navisworks install
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'native\extractor\bin\Release\Matchline.Extractor.exe'
          $missingInstall = Join-Path $env:scratch 'no-such-navisworks'

          $output = & $exe --input $env:inputPath --cache-dir $env:cacheDir --navisworks-dir $missingInstall 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output

          # NavisworksNotInstalled, native/extractor/ExitCodes.cs.
          if ($exitCode -ne 4) {
            throw "expected exit code 4 (NavisworksNotInstalled), got $exitCode"
          }
          if ($output -notmatch '"NW_NOT_INSTALLED"') {
            throw 'expected an NW_NOT_INSTALLED error line on stdout'
          }
          if ($output -notmatch '"STALE_CACHE_DISCARDED"') {
            throw 'expected a STALE_CACHE_DISCARDED warning for the pre-seeded garbage cache'
          }
          Write-Host 'e_sqlite3.dll loaded under net48; the garbage cache was discarded before NW_NOT_INSTALLED.'

      # Consumed by package-smoke (this workflow) and release.yml's
      # windows-release job, both of which need the real exe rather than
      # rebuilding it a second time on a different runner.
      - name: Upload the built launcher
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: extractor-bin
          path: native/extractor/bin/Release
          if-no-files-found: error
          retention-days: 3

  # Proves the Windows installer can still be produced from a clean checkout.
  # Deliberately unsigned: apps/desktop/electron-builder.yml switches every
  # signing path off explicitly, and this job consumes no signing secrets at all,
  # so it runs on pull requests from anywhere without a certificate existing.
  # Signing is release.yml's job and it fails loudly without credentials.
  package-smoke:
    name: windows packaging smoke (unsigned)
    runs-on: windows-latest
    # The launcher this job packages and then runs is native-smoke's real
    # Windows build, not a rebuild here — one build, tested twice, is the point.
    needs: native-smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Post-install setup
        run: npm run postsetup

      # NOTE: actions/download-artifact is not yet in this repository's approved
      # action set (see release.yml's publish job for the same note). Approving
      # it is an org/repo settings change, not a workflow change; this job fails
      # at this step until that is done.
      - name: Download the built launcher
        uses: actions/download-artifact@v4
        with:
          name: extractor-bin
          path: native/extractor/bin/Release

      # No --allow-missing here on purpose: this is Windows CI packaging a real
      # build, and B1 in docs/AUDIT-2026-09-02-NWD-TO-SSM.md was exactly a
      # Windows package silently shipping without a launcher. A missing/partial
      # download fails loudly here rather than producing an installer that
      # looks fine and cannot extract anything.
      - name: Stage the launcher for packaging
        run: node apps/desktop/scripts/stage-native.mjs

      - name: Build workspaces
        run: npm run build

      - name: Build desktop bundles
        run: npm run build:desktop

      - name: Package Windows (unsigned)
        run: npm run package:win

      # Names come from apps/desktop/electron-builder.yml:
      #   nsis.artifactName  ${productName}-${version}-Setup-${arch}.${ext}
      #   artifactName       ${productName}-${version}-${os}-${arch}.${ext}
      # Matched by glob rather than by version so a version bump does not break
      # CI. Present-but-zero-bytes is the failure mode this guards against — a
      # truncated installer is worse than no installer, because it looks like one.
      - name: Assert the installer and the zip exist and are non-empty
        shell: bash
        run: |
          set -eo pipefail
          shopt -s nullglob

          status=0
          installers=(apps/desktop/release/*-Setup-*.exe)
          archives=(apps/desktop/release/*-win-*.zip)

          if [ ${#installers[@]} -eq 0 ]; then
            echo "MISSING: apps/desktop/release/*-Setup-*.exe — electron-builder produced no NSIS installer" >&2
            status=1
          fi
          if [ ${#archives[@]} -eq 0 ]; then
            echo "MISSING: apps/desktop/release/*-win-*.zip — electron-builder produced no portable zip" >&2
            status=1
          fi

          for artifact in "${installers[@]}" "${archives[@]}"; do
            if [ -s "$artifact" ]; then
              echo "ok    $artifact  $(wc -c < "$artifact") bytes"
            else
              echo "EMPTY: $artifact" >&2
              status=1
            fi
          done

          exit $status

      # B1 in docs/AUDIT-2026-09-02-NWD-TO-SSM.md: a packaged build previously
      # shipped no launcher at all, and nothing checked. This is that check —
      # against the actual packaged tree electron-builder produced, not the
      # staging directory that fed it.
      - name: Assert the packaged launcher shipped and answers a bad command line
        shell: bash
        run: |
          set -eo pipefail
          exe="apps/desktop/release/win-unpacked/resources/extractor/Matchline.Extractor.exe"

          if [ ! -f "$exe" ]; then
            echo "MISSING: $exe — electron-builder packaged no launcher" >&2
            exit 1
          fi

          set +e
          output=$("$exe")
          status=$?
          set -e
          echo "$output"

          # InvalidArguments, native/extractor/ExitCodes.cs.
          if [ "$status" -ne 2 ]; then
            echo "expected exit code 2 (InvalidArguments) with no arguments, got $status" >&2
            exit 1
          fi
          if ! echo "$output" | grep -q '"INVALID_ARGS"'; then
            echo "expected an INVALID_ARGS error line on stdout" >&2
            exit 1
          fi

      # Short retention on purpose: these are ~230 MB per run and they are a
      # smoke result, not a release. Signed release artifacts come from
      # release.yml and are kept longer. compression-level 0 because both
      # artifacts are already compressed.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-smoke
          path: |
            apps/desktop/release/*-Setup-*.exe
            apps/desktop/release/*-win-*.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
