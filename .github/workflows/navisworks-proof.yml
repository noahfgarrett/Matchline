# The self-hosted half of the CI matrix: everything that needs a real Autodesk
# Navisworks install and a real model. Nothing here runs on GitHub's runners and
# nothing here runs automatically — it is dispatched by hand, against a model
# that already sits on the runner's own disk.
#
# HONEST STATUS NOTICE. Milestone 6 (real Windows proof) owns the scripts under
# scripts/windows-proof/. All seven now exist and are tested against the fake
# extractor (tests/windows-proof/scripts.test.mjs — no real Navisworks starts
# there). Every step that calls one still checks for it first and FAILS if it
# is absent — there is deliberately no `continue-on-error` anywhere in this
# file, because a proof job that goes green without proving anything is worse
# than no job at all. Dispatched on a real, labelled runner, this workflow now
# genuinely proves the real thing.
#
# CONFIDENTIALITY. The model is named by a path that already exists on the
# runner; it is never uploaded, never checked in, and never leaves the machine.
# The only artifact this workflow uploads is the anonymized summary described
# below (counts and timings). See docs/RELEASE-RUNBOOK.md, "Self-hosted
# Navisworks runner".
name: Navisworks proof (self-hosted)

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Path to an NWD/NWC/NWF that ALREADY EXISTS on the runner. Never uploaded.'
        required: true
        type: string
      navisworks_install_dir:
        description: 'Navisworks install folder the 2025 adapter compiles against.'
        required: false
        default: 'C:\Program Files\Autodesk\Navisworks Manage 2025'
        type: string
      configuration:
        description: 'MSBuild configuration for the native build.'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

# One proof run at a time. The runner drives a real Navisworks instance; two
# concurrent runs would fight over it. Queued rather than cancelled, because a
# half-cancelled Navisworks is exactly the state the cancellation test is trying
# to characterise deliberately.
concurrency:
  group: navisworks-proof
  cancel-in-progress: false

jobs:
  # A dispatch against a label nobody is listening on queues silently and never
  # starts — the "honest outcome" the comment below describes, but honest is
  # not the same as visible: a queued run looks identical to a slow one until
  # someone goes looking. This job fails loudly, in seconds, on GitHub's own
  # hosted runners (no self-hosted machine needed to run the check), instead of
  # a dispatch nobody notices timed out.
  check-runner:
    name: Require an online navisworks-2025 runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fail fast if no online self-hosted runner carries the required labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          match=$(gh api "repos/$GH_REPO/actions/runners" --paginate --jq '
            .runners[]
            | select(.status == "online")
            | select((["self-hosted","windows","navisworks-2025"] - [.labels[].name]) == [])
            | .name
          ')
          if [ -z "$match" ]; then
            echo "No ONLINE self-hosted runner is registered with all of the labels: self-hosted, windows, navisworks-2025." >&2
            echo "" >&2
            echo "navisworks-proof.yml's proof job is runs-on: [self-hosted, windows, navisworks-2025] —" >&2
            echo "a Windows machine with Navisworks Manage/Simulate 2025 installed, registered as a" >&2
            echo "self-hosted runner carrying exactly those labels (docs/RELEASE-RUNBOOK.md," >&2
            echo "'Self-hosted Navisworks runner'). Without one, a dispatch queues forever rather than" >&2
            echo "failing, which is why this check exists: failing here is the honest outcome instead" >&2
            echo "of a run that silently never starts." >&2
            exit 1
          fi
          echo "found an online runner carrying the required labels."

  proof:
    name: Navisworks 2025 proof
    needs: check-runner
    # Label-gated. `navisworks-2025` is the label the owner puts on the runner
    # that actually has Navisworks Manage/Simulate 2025 installed; without such a
    # runner registered, a dispatch queues and never starts, which is the honest
    # outcome — see the runbook. Later adapters get their own labelled runners
    # (navisworks-2024, navisworks-2026) and their own copy of this job.
    runs-on: [self-hosted, windows, navisworks-2025]

    # Inputs are handed to the steps as environment variables rather than
    # interpolated into the shell scripts below. Interpolating a dispatch input
    # straight into a `run:` body is a script-injection hole; this way the value
    # is data, not code.
    env:
      MATCHLINE_PROOF_MODEL: ${{ inputs.model_path }}
      MATCHLINE_PROOF_OUT: artifacts/windows-proof
      MATCHLINE_NAVISWORKS_INSTALL_DIR: ${{ inputs.navisworks_install_dir }}
      MATCHLINE_CONFIGURATION: ${{ inputs.configuration }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Fail before doing ten minutes of work if the model the operator named is
      # not on this machine. It is a runner-local path on purpose.
      - name: Check the model is present on the runner
        shell: bash
        run: |
          set -eo pipefail
          if [ ! -f "$MATCHLINE_PROOF_MODEL" ]; then
            echo "MISSING: no file at the dispatched model_path on this runner." >&2
            echo "The proof runs against a model that already lives on the runner's disk. Nothing is uploaded." >&2
            exit 1
          fi
          echo "model present, $(wc -c < "$MATCHLINE_PROOF_MODEL") bytes"

      - name: Install
        run: npm ci

      - name: Post-install setup
        run: npm run postsetup

      # The TypeScript cache reader (@matchline/model-schema) has to be built
      # before the cache-validation step can point it at a C#-written file.
      - name: Build workspaces
        run: npm run build

      # native/Directory.Build.props falls back to 1.0.0-rc.1 without this; read
      # once so meta.extractor_version names the real app version.
      - name: Read the app version
        id: version
        shell: bash
        run: |
          set -eo pipefail
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "could not read \"version\" from package.json" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # THE REAL COMPILE. No stubs, no escape hatch: this resolves
      # Autodesk.Navisworks.Api out of the install directory, and
      # MatchlineCheckNavisworksReference in the adapter csproj fails the build
      # with a readable message if that assembly is not there. This is the step
      # that turns "the stub build is green" into "the plugin compiles against
      # the real API surface".
      - name: Compile the plugin and launcher against the real Navisworks API
        shell: bash
        run: |
          set -eo pipefail
          dotnet build native/Matchline.Extraction.sln \
            -c "$MATCHLINE_CONFIGURATION" \
            -p:NavisworksInstallDir="$MATCHLINE_NAVISWORKS_INSTALL_DIR" \
            -p:Version=${{ steps.version.outputs.value }}

      # Compiling the adapter proves nothing about what Navisworks itself would
      # load unless the bytes under test are the bytes Navisworks sees — the
      # High finding in docs/AUDIT-2026-09-02-NWD-TO-SSM.md ("Proof workflow
      # proves an unknown binary"): previously nothing deployed here, so a
      # runner where someone had hand-copied a DLL per the runbook's §4 was
      # testing whatever was copied last, not this run's build. This step
      # deploys the DLLs this run just compiled and proves, by hash, that the
      # deployed copy is byte-for-byte the built one.
      - name: Deploy the compiled adapter into the Navisworks Plugins folder
        shell: bash
        run: |
          set -eo pipefail
          built="native/navisworks-2025/bin/Release"
          deployed="$MATCHLINE_NAVISWORKS_INSTALL_DIR/Plugins/Matchline.Extraction.Navisworks2025"

          if [ ! -d "$built" ]; then
            echo "MISSING: $built — the adapter did not compile." >&2
            exit 1
          fi

          shopt -s nullglob
          dlls=("$built"/*.dll)
          if [ ${#dlls[@]} -eq 0 ]; then
            echo "MISSING: no *.dll under $built" >&2
            exit 1
          fi

          mkdir -p "$deployed"
          cp -f "${dlls[@]}" "$deployed/"

          status=0
          for dll in "${dlls[@]}"; do
            name=$(basename "$dll")
            built_hash=$(sha256sum "$dll" | cut -d' ' -f1)
            deployed_hash=$(sha256sum "$deployed/$name" | cut -d' ' -f1)
            if [ "$built_hash" != "$deployed_hash" ]; then
              echo "MISMATCH: $name differs between the built copy and the deployed copy" >&2
              status=1
            else
              echo "ok    $name  $built_hash"
            fi
          done
          exit $status

      - name: Upload the built adapter DLLs
        uses: actions/upload-artifact@v4
        with:
          name: adapter-navisworks-2025
          path: native/navisworks-2025/bin/Release/*.dll
          if-no-files-found: error
          retention-days: 30

      # One place that says which of M6's scripts are missing, all at once,
      # instead of discovering them one failed dispatch at a time. Each step
      # below still guards its own script: this list is diagnostics, the guards
      # are the contract.
      #
      # Contract for M6: each script is `node scripts/windows-proof/<name>.mjs`
      # with no arguments, reading MATCHLINE_PROOF_MODEL (input model),
      # MATCHLINE_PROOF_OUT (output directory) and
      # MATCHLINE_NAVISWORKS_INSTALL_DIR from the environment, exiting non-zero
      # on any failed assertion. Full contract in docs/RELEASE-RUNBOOK.md.
      - name: Preflight — required M6 proof scripts
        shell: bash
        run: |
          set -eo pipefail
          required=(
            scripts/windows-proof/extract.mjs
            scripts/windows-proof/validate-cache.mjs
            scripts/windows-proof/cache-hit.mjs
            scripts/windows-proof/cancellation.mjs
            scripts/windows-proof/selection-sets.mjs
            scripts/windows-proof/search-sets.mjs
            scripts/windows-proof/error-classification.mjs
          )
          missing=0
          for script in "${required[@]}"; do
            if [ -f "$script" ]; then
              echo "ok      $script"
            else
              echo "MISSING $script" >&2
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "" >&2
            echo "$missing proof script(s) absent. M6 (real Windows proof) provides these scripts." >&2
            echo "This workflow is scaffolding until they land, and it fails rather than reporting a proof that did not happen." >&2
            exit 1
          fi

      - name: Extract the model (real launcher, real Navisworks)
        shell: bash
        run: |
          set -eo pipefail
          script=scripts/windows-proof/extract.mjs
          [ -f "$script" ] || { echo "MISSING $script — M6 provides this script." >&2; exit 1; }
          node "$script"

      # Reads the cache the C# writer just produced with the same TypeScript
      # reader the app ships, so the two halves cannot drift into agreeing only
      # with themselves (the argument in native/README.md, "Verifying without
      # Windows", applied to a real model instead of a synthetic stream).
      - name: Validate the cache with the TypeScript reader
        shell: bash
        run: |
          set -eo pipefail
          script=scripts/windows-proof/validate-cache.mjs
          [ -f "$script" ] || { echo "MISSING $script — M6 provides this script." >&2; exit 1; }
          node "$script"

      - name: Re-run is a cache hit and never starts Navisworks
        shell: bash
        run: |
          set -eo pipefail
          script=scripts/windows-proof/cache-hit.mjs
          [ -f "$script" ] || { echo "MISSING $script — M6 provides this script." >&2; exit 1; }
          node "$script"

      - name: Cancellation mid-run leaves no cache behind
        shell: bash
        run: |
          set -eo pipefail
          script=scripts/windows-proof/cancellation.mjs
          [ -f "$script" ] || { echo "MISSING $script — M6 provides this script." >&2; exit 1; }
          node "$script"

      - name: Selection Set behaviour
        shell: bash
        run: |
          set -eo pipefail
          script=scripts/windows-proof/selection-sets.mjs
          [ -f "$script" ] || { echo "MISSING $script — M6 provides this script." >&2; exit 1; }
          node "$script"

      # Hard gate 16: Search Sets are either fully resolved or honestly blocked.
      # The script's job is to decide which, and to fail if the answer is
      # "returned empty and called it an answer".
      - name: Search Set behaviour (resolved, or honestly gated)
        shell: bash
        run: |
          set -eo pipefail
          script=scripts/windows-proof/search-sets.mjs
          [ -f "$script" ] || { echo "MISSING $script — M6 provides this script." >&2; exit 1; }
          node "$script"

      - name: Error classification vocabulary
        shell: bash
        run: |
          set -eo pipefail
          script=scripts/windows-proof/error-classification.mjs
          [ -f "$script" ] || { echo "MISSING $script — M6 provides this script." >&2; exit 1; }
          node "$script"

      # Counts and timings only. The scripts above are responsible for writing
      # nothing model-derived into this directory — no tags, no file names, no
      # property values (RELEASE-1.0-PLAN.md P0-3: "No client data committed —
      # anonymized counts/timings only"). Caches and models must not be written
      # here at all. `if-no-files-found: error` because a proof that produced no
      # summary did not produce a result.
      - name: Upload the anonymized proof summary
        uses: actions/upload-artifact@v4
        with:
          name: navisworks-proof-summary
          path: artifacts/windows-proof/**
          if-no-files-found: error
          retention-days: 30
